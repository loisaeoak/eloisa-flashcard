<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Descubra a verdade</title>
<style>
/* Estilos gerais da página */
body {
font-family: Arial, sans-serif;
background-color: #1a1a1a;
color: #ffffff;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
height: 100vh;
margin: 0;
}

h1 {
margin-bottom: 30px;
font-size: 2.5rem;
text-align: center;
text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
}

/* Container do cartão com perspectiva para o efeito 3D */
.card-container {
width: 320px;
height: 420px;
perspective: 1000px;
}

/* O elemento que vai girar */
.card {
width: 100%;
height: 100%;
position: relative;
transform-style: preserve-3d;
transition: transform 0.8s ease;
cursor: pointer;
}

/* Efeito de giro ao passar o mouse */
.card-container:hover .card {
transform: rotateY(180deg);
}

/* Estilo comum para a frente e o verso */
.card-front, .card-back {
width: 100%;
height: 100%;
position: absolute;
top: 0;
left: 0;
backface-visibility: hidden;
border-radius: 15px;
overflow: hidden;
box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4);
display: flex;
flex-direction: column;
justify-content: flex-end;
background-color: #2c2c2c;
}

/* Verso do cartão (já começa virado para trás) */
.card-back {
transform: rotateY(180deg);
background-color: #1f3a60;
}

/* Imagem de fundo em ambos os lados */
.card-front img, .card-back img {
width: 100%;
height: 100%;
object-fit: cover;
position: absolute;
top: 0;
left: 0;
z-index: 1;
filter: brightness(0.7);
}

/* Caixa de texto sobreposta à imagem */
.card-content {
position: relative;
z-index: 2;
padding: 20px;
background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
text-align: center;
}

.card-content p {
font-size: 1.2rem;
font-weight: bold;
margin: 0;
line-height: 1.4;
}
</style>
</head>
<body>

<h1>Descubra a verdade</h1>

<div class="card-container">
<div class="card">
<!-- Frente do Cartão -->
<div class="card-front">
<img src="https://images.unsplash.com/photo-1513332454645-c052445037dd?auto=format&fit=crop&w=600&q=80" alt="Raio atingindo algum lugar">
<div class="card-content">
<p>“Raios nunca atingem o mesmo lugar duas vezes”</p>
</div>
</div>

<!-- Verso do Cartão -->
<div class="card-back">
<img src="https://images.unsplash.com/photo-1513332454645-c052445037dd?auto=format&fit=crop&w=600&q=80" alt="Raio atingindo algum lugar">
<div class="card-content">
<p>“Mito! Podem atingir o mesmo local várias vezes”</p>
</div>
</div>
</div>
</div>

</body>
</html>
